<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相撲 | Sumo Loop</title>
<meta name="description" content="A looping pixel-art sumo tournament. Win streaks tilt the odds and bring the fans out with signs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0716;--magenta:#ff2e88;--cyan:#27e8ff;--amber:#ffb347;--paper:#eee6ff;--muted:#a99cc9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 80% 0%,rgba(255,46,136,.2),transparent 55%),var(--ink);color:var(--paper);font-family:'Rajdhani',sans-serif;font-size:1.15rem;line-height:1.5;min-height:100vh}
a{color:var(--cyan);text-decoration:none;font-weight:600}
a:hover{color:var(--magenta)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 6%;border-bottom:1px solid rgba(255,46,136,.4)}
header .mark{font-family:'Shippori Mincho B1',serif;font-size:1.5rem;color:var(--magenta);text-shadow:0 0 14px var(--magenta)}
header div{display:flex;gap:24px}
main{max-width:1000px;margin:0 auto;padding:40px 5% 60px}
h1{font-family:'Shippori Mincho B1',serif;font-size:clamp(2rem,6vw,3.2rem);text-shadow:0 0 18px rgba(255,46,136,.7);line-height:1.1}
.lede{color:var(--muted);margin:12px 0 26px;max-width:62ch}
.stage{position:relative;border:2px solid var(--magenta);box-shadow:0 0 30px rgba(255,46,136,.35)}
canvas{display:block;width:100%;height:auto;background:#0c0618}
#banner{position:absolute;top:7%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#banner.on{opacity:1}
#banner b{font-family:'Shippori Mincho B1',serif;font-size:clamp(1.6rem,6vw,3rem);color:var(--amber);text-shadow:0 0 18px var(--amber);margin-right:12px}
#banner span{font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:700;color:var(--paper);text-shadow:0 0 10px var(--magenta)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.board div{padding:12px 16px;background:rgba(18,10,36,.8);border:1px solid rgba(39,232,255,.45)}
.board small{display:block;color:var(--muted)}
.board i{display:inline-block;width:12px;height:12px;margin-right:8px;border:1px solid var(--paper);vertical-align:-1px}
.board em{font-style:normal;color:var(--amber);font-weight:700}
.board .who{cursor:help;border-bottom:1px dotted var(--muted);outline-offset:2px}
.board .odds{display:none}
.board .who:hover .odds,.board .who:focus .odds{display:inline}
.board .co{color:var(--amber)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:16px;flex-wrap:wrap}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.rules{color:var(--muted);font-size:1rem;margin-top:14px}
button{font:inherit;font-weight:700;padding:10px 24px;background:transparent;color:var(--cyan);border:1px solid var(--cyan);cursor:pointer;transition:.25s}
button:hover{background:var(--cyan);color:var(--ink);box-shadow:0 0 22px var(--cyan)}
@media(max-width:560px){.board{grid-template-columns:1fr}}
</style>
<script>(function(){if(/[?&]embed/.test(location.search)){var e=document.createElement("style");e.textContent="header,header.bar,main>h1,main>p,main>.rules,footer,.rules,.districts{display:none!important}html,body{background:#05020a!important}body{padding:6px!important;margin:0!important;min-height:0!important}main{padding:0!important;margin:0 auto!important;max-width:none!important}";document.head.appendChild(e)}})()</script>

<body>
<header>
  <span class="mark">相撲</span>
  <div><a href="future.html">Neo-Edo</a><a href="index.html">Home</a></div>
</header>
<main>
  <h1>Sumo Loop</h1>
  <p class="lede">Two wrestlers meet on the dohyō. One is pushed out, a new challenger steps in, and the fight starts again. Looks, names and results are random, but a hot streak tilts the odds, and the crowd notices.</p>
  <div class="stage">
    <canvas id="c" width="960" height="540" role="img" aria-label="Sumo wrestlers fighting in a ring while fans cheer and hold up signs, shown as a documentary photo or as black silhouettes"></canvas>
    <div id="banner"><b>勝</b><span id="win"></span></div>
  </div>
  <div class="board" role="status" aria-live="polite">
    <div><small>West</small><span id="bl"></span></div>
    <div><small>East</small><span id="br"></span></div>
  </div>
  <div class="row"><span id="count">Bouts fought: 0</span><span class="btns"><button id="look" type="button"></button> <button id="pause" type="button">Pause</button></span></div>
  <p class="rules" id="rules"></p>
</main>

<script>
/* ============ tunables ============ */
const FAN_MIN_WINS=5;    // wins in a row before fans hold up signs
const COSTUME_EVERY=7;   // every Nth bout, one wrestler turns up in a real-world uniform
const STREAK_BIAS=0.35;  // how much each extra win of streak tilts the odds
const MAX_EDGE=0.85;     // nobody is ever more than 85% to win (underdog keeps 15%)

const cv=document.getElementById('c'),dctx=cv.getContext('2d');
const CW=480,CH=270,GY=200,FLOOR=262;
/* draw layers: scene is built on small canvases, then styled and scaled onto the display canvas */
const mkC=()=>{const k=document.createElement('canvas');k.width=CW;k.height=CH;return k};
const LBG=mkC(),LCR=mkC(),LSG=mkC(),LFT=mkC(),LCP=mkC(),LT1=mkC(),LT2=mkC();
const cBG=LBG.getContext('2d'),cCR=LCR.getContext('2d'),cSG=LSG.getContext('2d'),cFT=LFT.getContext('2d'),cCP=LCP.getContext('2d'),cT1=LT1.getContext('2d'),cT2=LT2.getContext('2d');
let ctx=cFT;
let look='photo',pendingLook='photo',fade=0,frameN=0;
const CROPS={photo:{x:30,y:36,w:420,h:236},sil:{x:0,y:0,w:480,h:270}};       // canvas size, ring ground line, landing line
const pick=a=>a[Math.random()*a.length|0];
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const OUT='#0b0510';
const SK=['#f6d2b0','#e8b48a','#d09a6a','#b27348','#8a5232','#5e3522'];
const HR=['#15121a','#3b2314','#8a4b1f','#c0392b','#2f6bff','#ff5fa2','#35d07f','#f2f2f2','#f5c542','#9b5de5'];
const BL=['#ff2e88','#27e8ff','#ffb347','#7c5cff','#e8e8e8','#2ecc71','#c0392b'];
const P=['Tora','Kuro','Aka','Ao','Shiro','Kita','Hoshi','Yama','Kaze','Ryu'];
const S=['fuji','umi','zakura','maru','shima','nada','kaze','hana','yama','ryu'];
const HOME={L:150,R:330},HALF=21;
const RING_L=100,RING_R=380;

/* ---------- colour + pixel helpers ---------- */
const hx=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const rgb=a=>'rgb('+a.map(v=>Math.round(clamp(v,0,255))).join(',')+')';
const shade=(h,f)=>rgb(hx(h).map(v=>v*f));
const tint=(h,t)=>rgb(hx(h).map(v=>v+(255-v)*t));
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(0,Math.round(w)),Math.max(0,Math.round(h)))};
function E(c,cx,cy,rx,ry){
  ctx.fillStyle=c;
  const y0=Math.round(cy-ry),y1=Math.round(cy+ry);
  for(let y=y0;y<=y1;y++){
    const dy=(y+.5-cy)/ry;if(Math.abs(dy)>1)continue;
    const w=rx*Math.sqrt(1-dy*dy),x0=Math.round(cx-w),x1=Math.round(cx+w);
    if(x1>x0)ctx.fillRect(x0,y,x1-x0,1);
  }
}
function Ln(c,x0,y0,x1,y1,r){
  const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));
  for(let i=0;i<=n;i++){const t=i/n;E(c,x0+(x1-x0)*t,y0+(y1-y0)*t,r,r)}
}
function blob(cx,cy,rx,ry,base,dark,light){
  E(OUT,cx,cy,rx+1,ry+1);E(dark,cx,cy,rx,ry);E(base,cx-1,cy-1,rx-1.6,ry-1.6);
  if(light)E(light,cx-rx*.35,cy-ry*.45,Math.max(1,rx*.28),Math.max(1,ry*.2));
}
function limb(x0,y0,x1,y1,r,base,dark){
  Ln(OUT,x0,y0,x1,y1,r+1);Ln(dark,x0,y0,x1,y1,r);Ln(base,x0-1,y0-1,x1-1,y1-1,r-1.4);
}

/* ---------- fighters: minimal chibi sumo ---------- */
const COSTUMES=[
  {id:'firefighter',label:'Firefighter',top:'#d9a52a',sleeve:'#d9a52a',trim:'#e8e8ee',hat:'helmet',hatC:'#c8283c'},
  {id:'police',label:'Police Officer',top:'#24365f',sleeve:'#24365f',trim:'#ffd23a',hat:'cap',hatC:'#1a2748'},
  {id:'chef',label:'Chef',top:'#f4f4f4',sleeve:'#f4f4f4',trim:'#bbbbc6',hat:'toque',hatC:'#fafafa'},
  {id:'doctor',label:'Doctor',top:'#eaf2f4',sleeve:'#eaf2f4',trim:'#2fa7a0',hat:'scrub',hatC:'#2fa7a0'},
  {id:'astronaut',label:'Astronaut',top:'#e8ecf4',sleeve:'#e8ecf4',trim:'#ff7a1a',hat:'dome'},
  {id:'builder',label:'Construction Worker',top:'#ff7a1a',sleeve:'#ff7a1a',trim:'#d8ff3a',hat:'hardhat',hatC:'#ffd21e'},
  {id:'pilot',label:'Pilot',top:'#f2f2f2',sleeve:'#f2f2f2',trim:'#ffd23a',hat:'pilotcap',hatC:'#1a2748'},
  {id:'soccer',label:'Soccer Player',top:'#2f6bff',sleeve:'#2f6bff',trim:'#ffffff',hat:'band'}
];
function pickCostume(){
  const c=Object.assign({},pick(COSTUMES));
  if(c.id==='soccer')c.top=c.sleeve=pick(['#2f6bff','#ff2e88','#35d07f','#f5c542','#c0392b']);
  return c;
}
function mk(side,costume){
  const skin=pick(SK),belt=pick(BL);
  return{side,name:pick(P)+pick(S),skin,hair:pick(HR),belt,costume:costume||null,
    c:{dk:shade(skin,.7),far:shade(skin,.84),bd:shade(belt,.62)},
    x:side==='L'?-60:540,y:GY,alpha:1,ang:0,streak:0,
    arms:'down',lean:0,crouch:0,bob:0,air:false,from:0,to:0,
    fx:8,fl:0,bx:-9,bl:0,shout:false,vx:0,vy:0,spin:0};
}

function drawTop(co,B){
  const t=co.top;
  E(OUT,B.x,B.y-4,19.4,13.6);E(t,B.x,B.y-4,18.4,12.6);E(shade(t,.8),B.x+1,B.y+5,15,3.4);
  switch(co.id){
    case'firefighter':R(co.trim,B.x-17,B.y-9,34,2);R(co.trim,B.x-16,B.y-4,32,2);R('#8a6a1a',B.x-1,B.y-15,2,20);break;
    case'police':R(co.trim,B.x+7,B.y-11,3,3);for(let i=0;i<3;i++)R('#ffd23a',B.x,B.y-12+i*5,1,2);break;
    case'chef':for(let i=0;i<3;i++)R('#9a9aa8',B.x+4,B.y-12+i*5,2,2);R('#d0d0da',B.x+2,B.y-15,1,19);break;
    case'doctor':R(co.trim,B.x+7,B.y-10,6,2);R(co.trim,B.x+9,B.y-12,2,6);R('#2a2a38',B.x-4,B.y-15,1,4);R('#2a2a38',B.x-3,B.y-12,6,1);break;
    case'astronaut':R('#ff7a1a',B.x+3,B.y-12,10,6);R(OUT,B.x+3,B.y-12,10,1);R('#27e8ff',B.x+5,B.y-10,2,2);R('#ff2e88',B.x+9,B.y-10,2,2);break;
    case'builder':R(co.trim,B.x-8,B.y-16,2,20);R(co.trim,B.x+6,B.y-16,2,20);R(co.trim,B.x-17,B.y+1,34,2);break;
    case'pilot':R('#111',B.x+9,B.y-15,2,10);R(co.trim,B.x-3,B.y-16,7,2);R(co.trim,B.x-3,B.y-12,7,1);break;
    case'soccer':R(co.trim,B.x-17,B.y-6,34,2);R(co.trim,B.x+5,B.y-12,4,4);break;
  }
}
function drawHat(co,Hd){
  const h=co.hatC||'#888',d=shade(h,.7);
  switch(co.hat){
    case'helmet':E(OUT,Hd.x,Hd.y-4,10.8,8.4);E(h,Hd.x,Hd.y-5,9.8,7.2);R(OUT,Hd.x-12,Hd.y-1,25,4);R(d,Hd.x-11,Hd.y,23,2.5);R('#ffd23a',Hd.x+1,Hd.y-8,4,4);R(OUT,Hd.x+1,Hd.y-8,4,1);R(h,Hd.x-1,Hd.y-13,2,3);break;
    case'cap':E(OUT,Hd.x,Hd.y-4,10.4,7.6);E(h,Hd.x,Hd.y-5,9.4,6.4);R(OUT,Hd.x+1,Hd.y-1,14,3.6);R('#0e1630',Hd.x+2,Hd.y,12,2);R('#ffd23a',Hd.x+2,Hd.y-8,3,3);break;
    case'toque':R(OUT,Hd.x-6.6,Hd.y-13,13.2,10);R(h,Hd.x-5.6,Hd.y-12,11.2,9);E(OUT,Hd.x,Hd.y-15,9,5.4);E(h,Hd.x,Hd.y-15,8,4.6);R('#d8d8e4',Hd.x-3,Hd.y-12,1,8);R('#d8d8e4',Hd.x+2,Hd.y-12,1,8);break;
    case'scrub':E(OUT,Hd.x-.5,Hd.y-4,10.6,7);E(h,Hd.x-.5,Hd.y-4.5,9.6,6);R(OUT,Hd.x-1,Hd.y+1,11,7);R('#e8f4f4',Hd.x,Hd.y+2,9,5);R('#c8dcdc',Hd.x,Hd.y+5,9,1);break;
    case'dome':
      ctx.save();ctx.fillStyle='rgba(170,215,255,.32)';ctx.beginPath();ctx.arc(Hd.x,Hd.y,13,0,6.283);ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle=OUT;ctx.stroke();ctx.lineWidth=1.2;ctx.strokeStyle='#e8ecf4';ctx.beginPath();ctx.arc(Hd.x,Hd.y,12.4,0,6.283);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(Hd.x,Hd.y,10,3.6,4.7);ctx.stroke();ctx.restore();
      R(OUT,Hd.x-9,Hd.y+11,18,5);R('#e8ecf4',Hd.x-8,Hd.y+12,16,3);break;
    case'hardhat':E(OUT,Hd.x,Hd.y-4,10.6,8);E(h,Hd.x,Hd.y-5,9.6,7);R(OUT,Hd.x-11,Hd.y-1,23,3.6);R(d,Hd.x-10,Hd.y,21,2);R(d,Hd.x-1,Hd.y-12,2,5);break;
    case'pilotcap':E(OUT,Hd.x,Hd.y-4,10.4,7.6);E(h,Hd.x,Hd.y-5,9.4,6.4);R(OUT,Hd.x+1,Hd.y-1,12,3);R('#0e1630',Hd.x+2,Hd.y,10,1.6);R(co.trim,Hd.x-9,Hd.y-3,19,1.5);R('#ffd23a',Hd.x+1,Hd.y-8,4,2);R('#111',Hd.x+1,Hd.y+1,8,3);R('#6a7a9a',Hd.x+2,Hd.y+1,2,1);break;
    case'band':R(OUT,Hd.x-10,Hd.y-5.5,20,4);R('#fff',Hd.x-9,Hd.y-4.5,18,2);break;
  }
}

function drawF(w){
  const f=w.side==='L'?1:-1,cr=w.crouch,ln=w.lean,k=w.c,sk=w.skin,co=w.costume;
  ctx.save();ctx.globalAlpha=w.alpha;
  if(!w.ang&&!w.air)E('rgba(0,0,0,.35)',Math.round(w.x),GY+1,23,3);
  ctx.translate(Math.round(w.x),Math.round(w.y+w.bob));
  if(w.ang){ctx.translate(0,-24);ctx.rotate(w.ang);ctx.translate(0,24)}
  ctx.scale(f,1);

  const B={x:ln*.5,y:-21+cr*.6},Hd={x:ln*.8+2,y:-43+cr*.85};
  const SHn={x:B.x+9,y:B.y-6},SHf={x:B.x-9,y:B.y-6};
  const sleeve=co?co.sleeve:null;

  function hand(mode,S,near){
    switch(mode){
      case'knees':return[S.x+(near?8:4),S.y+14];
      case'fist': return[S.x+(near?13:9),-3];
      case'push': return[S.x+(near?18:15),S.y+(near?3:6)];
      case'grip': return[S.x+(near?16:13),S.y+(near?7:9)];
      case'brace':return[S.x+(near?12:9),S.y+(near?2:5)];
      case'up':   return[S.x+(near?4:-3),S.y-17];
      case'fall': return[S.x+(near?14:-12),S.y-8+(near?0:4)];
      default:    return[S.x+(near?4:-3),S.y+12];
    }
  }
  function arm(S,near){
    const h=hand(w.arms,S,near);
    const base=sleeve||(near?sk:k.far),dark=sleeve?shade(sleeve,.7):(near?k.dk:shade(sk,.64));
    limb(S.x,S.y,h[0],h[1],3.8,base,dark);
    blob(h[0],h[1],3.4,3.4,near?sk:k.far,near?k.dk:shade(sk,.64),null);
  }
  function leg(x,lift,near){
    blob(x,-6-lift*.7,5.6,6,near?sk:k.far,near?k.dk:shade(sk,.64),null);
  }

  arm(SHf,false);
  leg(w.bx*.5,w.bl,false);
  blob(B.x,B.y,19,16.5,sk,k.dk,null);                         // round body
  R(OUT,B.x+7,B.y-1,2,2);                                       // navel
  E(OUT,B.x,B.y+9,19.6,5.6);E(w.belt,B.x,B.y+9,18.6,4.6);E(k.bd,B.x,B.y+11.5,17,1.6);   // mawashi
  leg(w.fx*.5,w.fl,true);
  R(OUT,B.x+3,B.y+11,10,6);R(w.belt,B.x+4,B.y+12,8,4);R(k.bd,B.x+4,B.y+14,8,2);        // apron
  if(co)drawTop(co,B);
  // head: round, tiny face
  blob(Hd.x,Hd.y,9.2,8.8,sk,k.dk,null);
  R(OUT,Hd.x+3,Hd.y-1,2,2);R('#fff',Hd.x+3,Hd.y-1,1,1);R(OUT,Hd.x+2,Hd.y-4,4,1);
  if(w.shout){R(OUT,Hd.x+3,Hd.y+3,4,3);R('#8a1a2a',Hd.x+4,Hd.y+4,2,1)}else R(OUT,Hd.x+3,Hd.y+4,3,1);
  // hair: cap, plus a topknot unless a hat is covering it
  E(OUT,Hd.x,Hd.y-8,6.6,3.6);E(w.hair,Hd.x,Hd.y-8,5.6,2.8);
  const hat=co?co.hat:null;
  if(!hat||hat==='band'||hat==='dome'){E(OUT,Hd.x+3,Hd.y-11.5,3.8,3);E(w.hair,Hd.x+3,Hd.y-11.5,2.8,2.1)}
  if(co)drawHat(co,Hd);
  arm(SHn,true);
  ctx.restore();
}

/* ---------- crowd ---------- */
const FANSK=['#f6d2b0','#e8b48a','#d09a6a','#b27348','#8a5232'];
const SHIRT=['#ff2e88','#27e8ff','#ffb347','#7c5cff','#e8e8e8','#2ecc71','#c0392b','#4a6cf7'];
const back=[],front=[];
for(let i=0;i<31;i++)back.push({x:15+i*15,base:152,skin:pick(FANSK),hair:pick(HR),shirt:pick(SHIRT),ph:Math.random()*9,row:0,idx:i});
for(let i=0;i<32;i++)front.push({x:8+i*15,base:182,skin:pick(FANSK),hair:pick(HR),shirt:pick(SHIRT),ph:Math.random()*9,row:1,idx:i});
// the fans who hold signs: back-row indices, working outward from each side of the ring
const SIGN_SLOTS={L:[10,7,4,1],R:[20,23,26,29]};
let signUp={L:[0,0,0,0],R:[0,0,0,0]};
let cheerSide=null,cheerT=0;

function drawFan(fa,hold){
  const dim=fa.row===0?.78:1;
  const sh=shade(fa.shirt,dim),sk=shade(fa.skin,dim),hr=shade(fa.hair,dim);
  const side=fa.x<240?'L':'R',cheer=cheerSide===side&&cheerT>0;
  const up=hold||cheer;
  const bob=Math.round(Math.sin(time*(cheer?10:2)+fa.ph)*(cheer?2.2:.6));
  const y=fa.base+bob,x=fa.x;
  if(up){
    const wig=Math.round(Math.sin(time*9+fa.ph)*(hold?0:1.5));

function update(dt){

}

/* documentary photograph: desaturate, contrast, overhead light, vignette, film grain, sepia tone */
function photoGrade(){
  const img=cCP.getImageData(0,0,CW,CH),d=img.data;
  for(let y=0;y<CH;y++){
    const vy=(y-135)/135,ly=(y-205)/80;
    for(let x=0;x<CW;x++){
      const i=(y*CW+x)*4;
      let L=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;
      L=Math.min(1,Math.max(0,(L-.46)*1.5+.5));
      const vx=(x-240)/240,lx=(x-240)/170;
      const light=.5+.85*Math.exp(-(lx*lx+ly*ly)*.9);
      const vig=1-.42*(vx*vx*.8+vy*vy*.6);
      let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(frameN,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);const g=((h^(h>>>16))>>>0)/4294967296-.5;

    }

}

  if(fade>0){dctx.fillStyle='rgba(0,0,0,'+Math.min(1,fade)+')';dctx.fillRect(0,0,cv.width,cv.height)}
  ctx=cFT;
}

let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;fade=Math.max(0,fade-dt*2.4);
  if(!paused)update(dt);
  render();requestAnimationFrame(loop);
}
const btn=el('pause');
const label=()=>btn.textContent=paused?'Play':'Pause';
btn.onclick=()=>{paused=!paused;label()};
label();
el('look').onclick=()=>{pendingLook=pendingLook==='photo'?'sil':'photo';if(paused){look=pendingLook;fade=1}syncLook()};
syncLook();
if(paused)for(let i=0;i<60;i++)update(.05);   // reduced motion: start on a populated ring
requestAnimationFrame(loop);
</script>
</body>
</html>
