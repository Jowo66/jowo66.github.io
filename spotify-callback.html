<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Spotify login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0612;color:#f3ead8;font:16px/1.5 'Share Tech Mono',ui-monospace,monospace;text-align:center;padding:24px}b{color:#ffb347}</style></head>
<body><p id="m">Finishing the Spotify login&hellip;</p>
<script src="spotify-config.js"></script>
<script>
(async()=>{
  const m=document.getElementById('m'),q=new URLSearchParams(location.search),g=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const fail=t=>{m.innerHTML='<b>Spotify login did not finish.</b><br>'+t.replace(/[<>&]/g,'')+'<br><br>You can close this window and try again.'};
  if(q.get('error'))return fail(q.get('error'));
  if(!q.get('code'))return fail('No login code was returned.');
  if(q.get('state')!==g('jowo.sp.s'))return fail('The login state did not match.');
  const id=String(window.SPOTIFY_CLIENT_ID||g('jowo.spid')||'').trim();
  if(!id)return fail('No Client ID is set.');
  try{
    const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({
      grant_type:'authorization_code',code:q.get('code'),redirect_uri:location.origin+'/spotify-callback.html',client_id:id,code_verifier:g('jowo.sp.v')||''})});
    const j=await r.json();
    if(!r.ok)return fail(j.error_description||j.error||('HTTP '+r.status));
    localStorage.setItem('jowo.sp',JSON.stringify({a:j.access_token,r:j.refresh_token,e:Date.now()+j.expires_in*1000}));
    localStorage.removeItem('jowo.sp.v');localStorage.removeItem('jowo.sp.s');
    try{window.opener&&window.opener.postMessage({jowoSpotify:1},location.origin)}catch(e){}
    m.textContent='Connected! You can close this window.';setTimeout(()=>window.close(),600);
  }catch(e){fail(String(e&&e.message||e))}
})();
</script></body></html>
